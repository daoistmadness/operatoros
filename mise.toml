min_version = "2024.1.0"

[settings]
lockfile = true

[tools]
bun = "1.4.2"
hk = "1.56.1"
node = "24.19.0"

[env]
HK_MISE = "1"

[tasks.doctor]
description = "Check the local toolchain, workspace install, Git base, and development data"
run = """
set -eu
fail() {
  printf 'FAIL: %s\n' "$1" >&2
  printf 'Next: %s\n' "$2" >&2
  exit 1
}
git rev-parse --show-toplevel >/dev/null 2>&1 || fail "not inside a Git checkout" "cd to the repository root"
git rev-parse --verify 'origin/main^{commit}' >/dev/null 2>&1 || fail "origin/main is unavailable" "git fetch origin main"
command -v bun >/dev/null 2>&1 || fail "Bun is unavailable" "mise install"
[ "$(bun --version)" = "1.4.2" ] || fail "Bun 1.4.2 is not active" "mise install"
command -v hk >/dev/null 2>&1 || fail "hk is unavailable" "mise install"
[ -f bun.lock ] || fail "bun.lock is missing" "restore the repository lockfile"
[ -f mise.lock ] || fail "mise.lock is missing" "restore the repository lockfile"
[ -d node_modules ] && [ -x node_modules/.bin/turbo ] || fail "workspace dependencies are missing" "bun install --frozen-lockfile"
bash scripts/validate-wsl-bun.sh --probe . >/dev/null || fail "the active Bun is not a native WSL runtime" "mise install"
for forbidden_lockfile in package-lock.json apps/web/package-lock.json yarn.lock pnpm-lock.yaml; do
  [ ! -e "$forbidden_lockfile" ] || fail "$forbidden_lockfile exists" "remove the obsolete project lockfile and use bun.lock"
done
printf 'PASS: toolchain Bun=%s hk=%s\n' "$(bun --version)" "$(hk --version)"
printf 'PASS: workspace dependencies and native WSL Bun\n'
printf 'PASS: origin/main=%s\n' "$(git rev-parse 'origin/main^{commit}')"
printf 'PASS: checkout=%s branch=%s\n' "$(git rev-parse --show-toplevel)" "$(git branch --show-current)"
development_data_dir="$(bun packages/db/src/data-dir-cli.ts --repo . --format data-dir)" || fail "development data directory cannot be resolved" "Set OPERATOROS_DATA_DIR to an approved absolute directory"
development_schema_head="$(bun packages/db/src/schema-version-cli.ts --format current)" || fail "canonical schema head cannot be resolved" "Run bun install --frozen-lockfile"
development_database_status="$(bun packages/db/src/dev-db-cli.ts status --repo . --data-dir "$development_data_dir" --expected-schema "$development_schema_head")" || fail "development database status cannot be read" "Run make dev-db-status"
printf 'PASS: development data directory=%s\n' "$development_data_dir"
printf 'PASS: source schema head=%s\n' "$development_schema_head"
printf 'PASS: development database=%s\n' "$development_database_status"
"""

[tasks.test]
description = "Run the Bun automated test suites"
run = """
bun run test
bun test scripts/tests/*.test.ts
"""

[tasks.check]
description = "Run the repository quality and validation checks"
run = "bun run check"

[tasks.build]
description = "Build the production web artifact"
run = "bun run build"

[tasks.dev]
description = "Start the managed local Elysia and Vite development stack"
run = "./start-dev.sh"

[tasks."dev:api"]
description = "Run the native foreground Bun API for interactive debugging"
run = "bun run dev:api"

[tasks."dev:web"]
description = "Run the native foreground Vite frontend for interactive debugging"
run = "bun run dev:web"

[tasks."check:affected"]
description = "Run Turbo checks for packages affected since origin/main"
run = "bash scripts/check-affected.sh"

[tasks."check:full"]
description = "Run the complete repository validation authority"
run = "make test-release"

[tasks."test:fast"]
description = "Run the changed-path-aware fast validation tier"
run = "make test-fast"

[tasks."db:fresh"]
description = "Run the authoritative fresh SQLite database parity gate"
run = "make fresh-db-parity"

[tasks."podman:doctor"]
description = "Inspect the rootless Podman host"
run = "bash scripts/podman-ci.sh doctor"

[tasks."podman:build"]
description = "Build the API and production web OCI images"
run = "bash scripts/podman-ci.sh build"

[tasks."podman:smoke"]
description = "Run built images on loopback with disposable test data"
run = "bash scripts/podman-ci.sh smoke"

[tasks."podman:dev:smoke"]
description = "Verify rootless containerized development through the live tailnet route"
run = "bash scripts/podman-dev-smoke.sh"

[tasks."podman:quadlet:check"]
description = "Generate and verify source-controlled development Quadlets"
run = "bash scripts/podman-quadlet.sh check"

[tasks."podman:quadlet:plan"]
description = "Show the exact Quadlet installation diff without changing host files"
run = "bash scripts/podman-quadlet.sh plan"

[tasks."podman:quadlet:install"]
description = "Install reviewed Quadlets only with the explicit --apply argument"
run = "bash scripts/podman-quadlet.sh install"

[tasks."podman:up"]
description = "Start the rootless Quadlet development API and Vite services"
run = "bash scripts/podman-quadlet.sh up"

[tasks."podman:down"]
description = "Stop only OperatorOS development services and keep their data volumes"
run = "bash scripts/podman-quadlet.sh down"

[tasks."podman:restart"]
description = "Restart only the OperatorOS development Quadlet services"
run = "bash scripts/podman-quadlet.sh restart"

[tasks."podman:rebuild"]
description = "Rebuild the Quadlet-owned development image and restart its services"
run = "bash scripts/podman-quadlet.sh rebuild"

[tasks."podman:status"]
description = "Show OperatorOS development service status"
run = "bash scripts/podman-quadlet.sh status"

[tasks."podman:logs"]
description = "Follow sanitized OperatorOS development service logs"
run = "bash scripts/podman-quadlet.sh logs"

[tasks."podman:verify"]
description = "Build and verify production and development OCI modes and Quadlet generation"
run = "bash scripts/podman-ci.sh build && bash scripts/podman-ci.sh smoke && bash scripts/podman-dev-smoke.sh && bash scripts/podman-quadlet.sh check"

[tasks."podman:security"]
description = "Scan local OCI images for secrets and HIGH/CRITICAL vulnerabilities; write SBOMs"
run = "bash scripts/podman-security.sh"

[tasks."deploy:check"]
description = "Check rootless deployment prerequisites and report external target blockers"
run = "bash scripts/deploy.sh check"

[tasks."deploy:plan"]
description = "Validate an approved digest-pinned release manifest without mutation"
run = "bash scripts/deploy.sh plan"

[tasks."deploy:apply"]
description = "Apply a release only through an approved remote host adapter"
run = "bash scripts/deploy.sh apply"

[tasks."deploy:verify"]
description = "Run production OCI images against disposable canonical-schema data"
run = "bash scripts/deploy.sh verify"

[tasks."deploy:rollback"]
description = "Fault-inject and verify local digest-pinned rollback with disposable data"
run = "bash scripts/deploy.sh rollback"
