server {
    listen 8080 default_server;
    return 444;
}

server {
    listen 8080;
    server_name oprserver.taile856.ts.net localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /health { proxy_pass http://operatoros-api:8090/health; }
    location /api/ { proxy_pass http://operatoros-api:8090/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location / { try_files $uri $uri/ /index.html; }
}
