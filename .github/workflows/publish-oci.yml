name: Publish OCI release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full approved main commit SHA
        required: true
        type: string
      ci_run_id:
        description: Successful main CI run that produced this commit's OCI artifact
        required: true
        type: string
      release_version:
        description: Version recorded in the release manifest (for example 1.2.3)
        required: true
        type: string

permissions: {}

concurrency:
  group: operatoros-ghcr-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      artifact-name: ${{ steps.validate.outputs.artifact-name }}
      publish-enabled: ${{ steps.validate.outputs.publish-enabled }}
    steps:
      - name: Validate approved main commit and successful CI artifact
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PUBLISH_ENABLED: ${{ vars.OPERATOROS_ENABLE_GHCR_PUBLISH }}
        run: |
          set -euo pipefail
          fail() { printf 'FAIL: %s\n' "$1" >&2; exit 1; }
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || fail 'publication requires a manual workflow_dispatch event'
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail 'manual publication is allowed only from main'
          [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" && "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || fail 'source_commit must be the full SHA of this main workflow run'
          [[ "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || fail 'release_version must be a semantic version'
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || fail 'ci_run_id must be numeric'

          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
          run_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api")"
          jq -e --arg sha "$SOURCE_COMMIT" '
            .event == "push" and .head_branch == "main" and .head_sha == $sha and
            .status == "completed" and .conclusion == "success" and
            .path == ".github/workflows/ci.yml"
          ' <<<"$run_json" >/dev/null || fail 'ci_run_id is not a successful main push run for this source commit'
          attempt="$(jq -er '.run_attempt' <<<"$run_json")"

          pulls_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$SOURCE_COMMIT/pulls?per_page=100")"
          pull_json="$(jq -ce --arg sha "$SOURCE_COMMIT" '[.[] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha)] | if length == 1 then .[0] else empty end' <<<"$pulls_json")" || fail 'source commit must be the merge commit of exactly one merged main pull request'
          pull_number="$(jq -er '.number' <<<"$pull_json")"
          pull_head="$(jq -er '.head.sha' <<<"$pull_json")"
          pull_author="$(jq -er '.user.login' <<<"$pull_json")"
          reviews_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$pull_number/reviews?per_page=100")"
          jq -e --arg head "$pull_head" --arg author "$pull_author" '
            [.[] | select(.commit_id == $head and .user.login != $author)]
            | group_by(.user.login) | map(max_by(.submitted_at)) as $latest
            | ($latest | any(.state == "APPROVED")) and ($latest | all(.state != "CHANGES_REQUESTED"))
          ' <<<"$reviews_json" >/dev/null || fail 'the merged pull request has no current independent approval for its reviewed head commit'

          checks_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$pull_head/check-runs?per_page=100")"
          for check in api frontend podman-images 'Select E2E scope' 'Ubuntu / Bun 1.4.2' CodeQL; do
            jq -e --arg name "$check" '
              [.check_runs[] | select(.name == $name)]
              | if length == 0 then false else max_by(.completed_at // .started_at // .created_at) | .status == "completed" and .conclusion == "success" end
            ' <<<"$checks_json" >/dev/null || fail "required pull request check did not pass: $check"
          done

          jobs_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/jobs?per_page=100")"
          for job in api frontend podman-images; do
            jq -e --arg name "$job" '[.jobs[] | select(.name == $name and .conclusion == "success")] | length == 1' <<<"$jobs_json" >/dev/null || fail "required CI job did not pass: $job"
          done

          artifact_name="operatoros-oci-${SOURCE_COMMIT}-${attempt}"
          artifacts_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api/artifacts?per_page=100")"
          jq -e --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length == 1' <<<"$artifacts_json" >/dev/null || fail 'verified OCI artifact is missing or expired'
          if [[ "$PUBLISH_ENABLED" == true ]]; then
            publish_enabled=true
            echo '- GHCR publication gate: enabled; the `oci-publish` environment must still approve the job.' >> "$GITHUB_STEP_SUMMARY"
          else
            publish_enabled=false
            echo '- GHCR publication gate: **BLOCKED**; repository variable `OPERATOROS_ENABLE_GHCR_PUBLISH` is not `true`.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "publish-enabled=$publish_enabled" >> "$GITHUB_OUTPUT"
          echo "- Source commit: \`$SOURCE_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified CI run: [$CI_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reviewed pull request: [#$pull_number]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$pull_number)" >> "$GITHUB_STEP_SUMMARY"
          echo '- Required artifact-producing jobs: `api`, `frontend`, `podman-images`.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    if: ${{ needs.validate.outputs.publish-enabled == 'true' }}
    environment:
      name: oci-publish
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the verified OCI build and SBOMs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ needs.validate.outputs.artifact-name }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/operatoros-release
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Verify artifact checksums and load OCI images
        working-directory: ${{ runner.temp }}/operatoros-release
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          sha256sum --check oci-archives.sha256
          jq -se 'length == 2 and all(.[]; .bomFormat == "CycloneDX")' operatoros-api.cdx.json operatoros-web.cdx.json >/dev/null
          podman info --format 'version={{.Version.Version}} rootless={{.Host.Security.Rootless}} storage={{.Store.GraphDriverName}}'
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          podman load --input operatoros-api.oci
          podman load --input operatoros-web.oci
          podman image exists "localhost/operatoros-api:ci-${SOURCE_COMMIT}"
          podman image exists "localhost/operatoros-web:ci-${SOURCE_COMMIT}"
      - name: Authenticate to GHCR with the job-scoped GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -m 0600 /dev/null "$RUNNER_TEMP/operatoros-ghcr-auth.json"
          printf '%s' "$GH_TOKEN" | podman login --authfile "$RUNNER_TEMP/operatoros-ghcr-auth.json" --username "$REGISTRY_USER" --password-stdin ghcr.io
      - name: Publish and verify registry manifest digests
        id: publish
        env:
          AUTH_FILE: ${{ runner.temp }}/operatoros-ghcr-auth.json
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        working-directory: ${{ runner.temp }}/operatoros-release
        run: |
          set -euo pipefail
          api_name=ghcr.io/daoistmadness/operatoros-api
          web_name=ghcr.io/daoistmadness/operatoros-web
          tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          podman push --quiet --authfile "$AUTH_FILE" --digestfile "$RUNNER_TEMP/operatoros-api.digest" "localhost/operatoros-api:ci-${SOURCE_COMMIT}" "docker://${api_name}:${tag}"
          podman push --quiet --authfile "$AUTH_FILE" --digestfile "$RUNNER_TEMP/operatoros-web.digest" "localhost/operatoros-web:ci-${SOURCE_COMMIT}" "docker://${web_name}:${tag}"
          api_digest="$(cat "$RUNNER_TEMP/operatoros-api.digest")"
          web_digest="$(cat "$RUNNER_TEMP/operatoros-web.digest")"
          [[ "$api_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$web_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          api_ref="${api_name}@${api_digest}"
          web_ref="${web_name}@${web_digest}"
          podman pull --quiet --authfile "$AUTH_FILE" "$api_ref"
          podman pull --quiet --authfile "$AUTH_FILE" "$web_ref"
          podman image inspect "$api_ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' > "$RUNNER_TEMP/operatoros-api.repo-digests"
          podman image inspect "$web_ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' > "$RUNNER_TEMP/operatoros-web.repo-digests"
          grep -Fqx "$api_ref" "$RUNNER_TEMP/operatoros-api.repo-digests"
          grep -Fqx "$web_ref" "$RUNNER_TEMP/operatoros-web.repo-digests"
          api_sbom_sha="$(sha256sum operatoros-api.cdx.json | cut -d' ' -f1)"
          web_sbom_sha="$(sha256sum operatoros-web.cdx.json | cut -d' ' -f1)"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg source "$SOURCE_COMMIT" \
            --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg api "$api_ref" --arg web "$web_ref" \
            --arg api_sbom_sha "$api_sbom_sha" --arg web_sbom_sha "$web_sbom_sha" \
            '{manifestVersion: 1, releaseVersion: $version, sourceCommit: $source, schema: "20261002_s48", createdAt: $created, images: {api: $api, web: $web}, sbom: {api: {file: "operatoros-api.cdx.json", sha256: $api_sbom_sha}, web: {file: "operatoros-web.cdx.json", sha256: $web_sbom_sha}}}' \
            > "$RUNNER_TEMP/operatoros-release-manifest.json"
          jq -e --arg api "$api_ref" --arg web "$web_ref" '.schema == "20261002_s48" and .images.api == $api and .images.web == $web' "$RUNNER_TEMP/operatoros-release-manifest.json" >/dev/null
          echo "api-name=$api_name" >> "$GITHUB_OUTPUT"
          echo "api-digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "web-name=$web_name" >> "$GITHUB_OUTPUT"
          echo "web-digest=$web_digest" >> "$GITHUB_OUTPUT"
          echo "api-ref=$api_ref" >> "$GITHUB_OUTPUT"
          echo "web-ref=$web_ref" >> "$GITHUB_OUTPUT"
      - name: Attest API release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.api-name }}
          subject-digest: ${{ steps.publish.outputs.api-digest }}
          push-to-registry: true
      - name: Attest API CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.api-name }}
          subject-digest: ${{ steps.publish.outputs.api-digest }}
          sbom-path: ${{ runner.temp }}/operatoros-release/operatoros-api.cdx.json
          push-to-registry: true
      - name: Attest web release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.web-name }}
          subject-digest: ${{ steps.publish.outputs.web-digest }}
          push-to-registry: true
      - name: Attest web CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.web-name }}
          subject-digest: ${{ steps.publish.outputs.web-digest }}
          sbom-path: ${{ runner.temp }}/operatoros-release/operatoros-web.cdx.json
          push-to-registry: true
      - name: Package versioned release manifest and SBOMs
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/operatoros-release-package"
          mkdir -p "$output"
          cp "$RUNNER_TEMP/operatoros-release-manifest.json" "$output/"
          cp "$RUNNER_TEMP/operatoros-release"/*.cdx.json "$output/"
      - name: Upload versioned release metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operatoros-release-${{ inputs.release_version }}-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/operatoros-release-package/
          if-no-files-found: error
          retention-days: 90
      - name: Report immutable release identity
        if: always()
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          API_REF: ${{ steps.publish.outputs.api-ref }}
          WEB_REF: ${{ steps.publish.outputs.web-ref }}
          PUBLISH_RESULT: ${{ job.status }}
        run: |
          {
            echo '### GHCR OCI release'
            echo "- Result: **${PUBLISH_RESULT}**"
            if [[ "$PUBLISH_RESULT" == success ]]; then
              echo "- Source commit: \`${SOURCE_COMMIT}\`"
              echo "- API registry manifest: \`${API_REF}\`"
              echo "- Web registry manifest: \`${WEB_REF}\`"
              echo '- Both digests were pulled back and matched Podman RepoDigests before attestation.'
              echo '- Provenance and CycloneDX SBOM attestations were pushed for each image digest.'
              echo '- Registry tags are run-specific; deployment references come only from the digest-pinned manifest.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
