name: Synthetic deployment rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm_rehearsal:
        description: Confirm one isolated synthetic deployment rehearsal
        required: true
        default: false
        type: boolean

permissions:
  contents: none

concurrency:
  group: operatoros-deployment-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_rehearsal == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the locked toolchain
        uses: ./.github/actions/setup-bun
        with:
          cache-write: "false"

      - name: Verify the retained release and rehearse isolated deployment
        env:
          OPERATOROS_REHEARSAL_CONFIRMED: ${{ inputs.confirm_rehearsal }}
          OPERATOROS_RELEASE_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment-rehearsal.py

      - name: Retain sanitized rehearsal evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operatoros-deployment-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/operatoros-deployment-rehearsal-diagnostics.${{ github.run_id }}a${{ github.run_attempt }}/rehearsal.log
            ${{ runner.temp }}/operatoros-deployment-rehearsal-diagnostics.${{ github.run_id }}a${{ github.run_attempt }}/rehearsal-evidence.json
            ${{ runner.temp }}/operatoros-deployment-rehearsal-diagnostics.${{ github.run_id }}a${{ github.run_attempt }}/deploy-result.json
            ${{ runner.temp }}/operatoros-deployment-rehearsal-diagnostics.${{ github.run_id }}a${{ github.run_attempt }}/consumer-cleanup.log
          if-no-files-found: warn
          retention-days: 14
