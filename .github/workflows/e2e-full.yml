name: E2E Full Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master, develop]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select E2E scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run-e2e: ${{ steps.scope.outputs.run-e2e }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select E2E execution
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/select-e2e-scope.sh

  e2e-full:
    name: Ubuntu / Bun 1.4.3
    needs: changes
    if: always() && (needs.changes.result == 'failure' || needs.changes.outputs.run-e2e == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked toolchain and dependencies
        uses: ./.github/actions/setup-bun
      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-26.04-${{ runner.arch }}-playwright-${{ hashFiles('apps/web/package.json', 'bun.lock') }}
      - name: Install Playwright Chromium and Ubuntu dependencies
        working-directory: apps/web
        run: bun run --bun playwright install --with-deps chromium
      - name: Save Playwright Chromium
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-26.04-${{ runner.arch }}-playwright-${{ hashFiles('apps/web/package.json', 'bun.lock') }}
      - name: Run CI-only full regression with disposable reset verification
        env:
          CI: "true"
          DATABASE_URL: "sqlite:///:memory:"
          ENABLE_DESTRUCTIVE_OPERATIONS: "false"
          OPERATOROS_E2E_ADMIN_USERNAME: operatoros_e2e_admin
          OPERATOROS_E2E_ADMIN_PASSWORD: "E2E-Admin-2026-Secure!"
          OPERATOROS_E2E_PRESERVE_SUCCESS_ARTIFACTS: "true"
        run: timeout 900 make e2e-full
      - name: Report E2E summaries
        if: always()
        run: |
          for summary in e2e-results/summary.txt e2e-results/full-summary.txt; do
            if [[ -f "$summary" ]]; then
              cat "$summary"
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [[ -n "${PLAYWRIGHT_CACHE_HIT:-}" ]]; then
            echo "- Playwright browser cache exact hit: \`${PLAYWRIGHT_CACHE_HIT}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      - name: Upload concise E2E summaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operatoros-e2e-summaries
          path: |
            e2e-results/summary.txt
            e2e-results/full-summary.txt
            e2e-results/database-before.json
            e2e-results/database-after.json
            e2e-results/junit/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operatoros-e2e-failure-evidence
          path: |
            e2e-results/logs/
            e2e-results/junit/
            e2e-results/playwright/
          if-no-files-found: warn
          retention-days: 7
