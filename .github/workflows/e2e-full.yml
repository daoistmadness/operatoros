name: E2E Full Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/**"
      - "hk.pkl"

permissions:
  contents: read

concurrency:
  group: e2e-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-full:
    name: Ubuntu / Bun 1.4.2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: "sqlite:///:memory:"
      ENABLE_DESTRUCTIVE_OPERATIONS: "false"
      OPERATOROS_E2E_ADMIN_USERNAME: operatoros_e2e_admin
      OPERATOROS_E2E_ADMIN_PASSWORD: "E2E-Admin-2026-Secure!"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up mise toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Cache Bun package downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-
      - name: Verify mise toolchain
        run: |
          mise --version
          bun --version | grep -Eq "^1\.4\."
          hk --version | grep -Eq "^hk 1\.56\.1$"
          mise ls --current

      - name: Install backend TypeScript dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bun run --bun playwright install --with-deps chromium

      - name: Run CI-only full regression
        run: timeout 900 make e2e-full

      - name: Upload concise E2E summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: operatoros-e2e-summaries
          path: |
            e2e-results/summary.txt
            e2e-results/full-summary.txt
            e2e-results/database-before.json
            e2e-results/database-after.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: operatoros-e2e-failure-evidence
          path: |
            e2e-results/logs/
            e2e-results/junit/
            e2e-results/playwright/
          if-no-files-found: warn
          retention-days: 7
