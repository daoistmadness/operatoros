name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/api
    env:
      OPERATOROS_PYTHON_VENV: ${{ runner.temp }}/operatoros/python/venv
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Cache Bun package downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.0-
      - name: Cache Python package downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.12.3-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12.3-
      - name: Cache Turbo task results
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-2.10.12-${{ hashFiles('bun.lock', 'turbo.json', 'mise.toml', 'mise.lock', 'eslint.config.mjs', 'scripts/check-architecture.ts', 'scripts/check-typebox-resolution.ts') }}
          restore-keys: |
            ${{ runner.os }}-turbo-2.10.12-
      - name: Verify mise toolchain
        run: |
          mise --version
          bun --version | grep -Eq "^1\.4\."
          python --version
          mise ls --current
      - name: Bootstrap external fixture-tool virtualenv
        working-directory: ${{ github.workspace }}
        run: mise run python:bootstrap
      - name: Install workspace dependencies (frozen lockfile)
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile
      - name: Dependency security audit
        working-directory: ${{ github.workspace }}
        run: bun run security:audit
      - name: Security behavior tests
        working-directory: ${{ github.workspace }}
        run: bun run test:security
      - name: Verify hk and Turbo toolchain
        working-directory: ${{ github.workspace }}
        env:
          HK_MISE: "1"
        run: |
          hk --version | grep -Eq "^hk 1\.56\.1$"
          bun run turbo:version | grep -Eq "^2\.10\.12$"
      - name: Validate hk checks
        working-directory: ${{ github.workspace }}
        env:
          HK_MISE: "1"
        run: hk check --all
      - name: Validate Turbo orchestration
        working-directory: ${{ github.workspace }}
        run: |
          started_at=$(date +%s)
          bun run turbo:check
          echo "[CI timing] Turbo check: $(( $(date +%s) - started_at ))s"
      - name: Validate Turbo invalidation proofs
        working-directory: ${{ github.workspace }}
        run: bun run test:turbo
      - name: Prepare Elysia runtime database
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p .runtime/operatoros-ci-elysia
          python_tooling="$(bun scripts/python-tooling-env.ts --repo . print-executable)"
          DATABASE_URL="sqlite:///$PWD/.runtime/operatoros-ci-elysia/ci-test.db" PYTHONPATH=backend/src "$python_tooling" -m core.schema_migrations initialize-fresh --database "$PWD/.runtime/operatoros-ci-elysia/ci-test.db"
      - name: Verify Elysia primary runtime
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/.runtime/operatoros-ci-elysia/ci-test.db
          AUTH_COOKIE_SECRET: ci-elysia-test-secret-at-least-32-characters
          HOST: 127.0.0.1
          PORT: "8090"
          NODE_ENV: test
        run: |
          log_file="${RUNNER_TEMP}/operatoros-elysia.log"
          bun run src/server.ts >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8090/health >/dev/null && break
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8090/health >/dev/null
          curl --fail --silent http://127.0.0.1:8090/ready >/dev/null
      - name: TypeBox resolution check
        working-directory: ${{ github.workspace }}
        run: bun run check:typebox
      - name: ESLint workspace boundary check
        working-directory: ${{ github.workspace }}
        run: bun run lint
      - name: Semantic architecture boundary check
        working-directory: ${{ github.workspace }}
        run: bun run check:architecture
      - name: Architecture checker fixture tests
        working-directory: ${{ github.workspace }}
        run: bun run test:architecture
      - name: Contract boundary check
        working-directory: ${{ github.workspace }}
        run: bun run check:contracts
      - name: UI boundary check
        working-directory: ${{ github.workspace }}
        run: bun run check:ui

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Cache Bun package downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.0-
      - name: Verify Bun runtime and contract
        run: |
          mise --version
          bun --version | grep -Eq "^1\.4\."
          hk --version | grep -Eq "^hk 1\.56\.1$"
          mise ls --current
      - name: Install dependencies (frozen lockfile)
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile
      - name: Dependency deduplication check
        run: bun --filter @operatoros/web check:dependencies
      - name: UI boundary check
        working-directory: ${{ github.workspace }}
        run: bun run check:ui
      - name: Architecture boundaries test
        run: bun --filter @operatoros/web boundaries:test
      - name: OpenAPI contract drift check
        run: bun --filter @operatoros/web api:check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Verify docs toolchain
        run: |
          mise --version
          hk --version | grep -Eq "^hk 1\.56\.1$"
          python --version
      - name: Validate relative Markdown links
        run: python .github/scripts/check_markdown_links.py
      - name: Validate current developer commands
        run: python .github/scripts/check_current_developer_docs.py
