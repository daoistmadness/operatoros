name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      PYTHONPATH: src
      DATABASE_URL: sqlite:///${{ github.workspace }}/.runtime/operatoros-ci/ci-test.db
      AUTH_COOKIE_SECRET: ci-backend-test-secret-at-least-32-characters
      ENABLE_DESTRUCTIVE_OPERATIONS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create canonical backend virtualenv
        run: python -m venv .venv
      - name: Install backend dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Prepare isolated CI database
        run: |
          mkdir -p "${{ github.workspace }}/.runtime/operatoros-ci"
          .venv/bin/python -m core.schema_migrations initialize-fresh --database "${{ github.workspace }}/.runtime/operatoros-ci/ci-test.db"
      - run: .venv/bin/python -c "from src.main import app; assert app is not None; routes = {route.path for route in app.routes}; assert '/api/system/clear-data' in routes; assert '/api/system/health' in routes"
      - run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Node 24 and npm 11
        run: |
          test "$(node --version)" = "v24.13.0"
          npm --version | grep -Eq '^11\.'
      - run: npm ci
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate relative Markdown links
        run: python .github/scripts/check_markdown_links.py
