name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/api
    env:
      OPERATOROS_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Verify mise toolchain
        run: |
          mise --version
          bun --version | grep -Eq "^1\.4\."
          python --version
          mise ls --current
      - name: Create disposable fixture-tool virtualenv
        run: python -m venv ../../backend/.venv
      - name: Install schema and fixture tooling
        run: ../../backend/.venv/bin/python -m pip install -r ../../backend/requirements.txt
      - name: Install workspace dependencies (frozen lockfile)
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile
      - name: Prepare Elysia runtime database
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p .runtime/operatoros-ci-elysia
          DATABASE_URL="sqlite:///$PWD/.runtime/operatoros-ci-elysia/ci-test.db" PYTHONPATH=backend/src backend/.venv/bin/python -m core.schema_migrations initialize-fresh --database "$PWD/.runtime/operatoros-ci-elysia/ci-test.db"
      - name: Verify Elysia primary runtime
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/.runtime/operatoros-ci-elysia/ci-test.db
          AUTH_COOKIE_SECRET: ci-elysia-test-secret-at-least-32-characters
          HOST: 127.0.0.1
          PORT: "8090"
          NODE_ENV: test
        run: |
          log_file="${RUNNER_TEMP}/operatoros-elysia.log"
          bun run src/server.ts >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8090/health >/dev/null && break
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8090/health >/dev/null
          curl --fail --silent http://127.0.0.1:8090/ready >/dev/null
      - name: TypeBox resolution check
        working-directory: ${{ github.workspace }}
        run: bun run check:typebox
      - name: Backend TypeScript typecheck
        working-directory: ${{ github.workspace }}
        run: bun --filter @operatoros/api typecheck
      - name: Backend TypeScript tests
        working-directory: ${{ github.workspace }}
        run: bun --filter @operatoros/api test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Verify Bun runtime and contract
        run: |
          mise --version
          bun --version | grep -Eq "^1\.4\."
          mise ls --current
      - name: Install dependencies (frozen lockfile)
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile
      - name: Dependency deduplication check
        run: bun --filter @operatoros/web check:dependencies
      - name: Architecture boundaries test
        run: bun --filter @operatoros/web boundaries:test
      - name: OpenAPI contract drift check
        run: bun --filter @operatoros/web api:check
      - name: TypeScript validation
        run: bun --filter @operatoros/web typecheck
      - name: Frontend unit tests
        run: bun --filter @operatoros/web test
      - name: Build frontend bundle
        run: bun --filter @operatoros/web build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Verify docs toolchain
        run: |
          mise --version
          python --version
      - name: Validate relative Markdown links
        run: python .github/scripts/check_markdown_links.py
