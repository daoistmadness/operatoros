name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      PYTHONPATH: src
      DATABASE_URL: sqlite:///${{ github.workspace }}/.runtime/operatoros-ci/ci-test.db
      AUTH_COOKIE_SECRET: ci-backend-test-secret-at-least-32-characters
      ENABLE_DESTRUCTIVE_OPERATIONS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Verify mise toolchain
        run: |
          mise --version
          python --version
          mise ls --current
      - name: Create canonical backend virtualenv
        run: python -m venv .venv
      - name: Install backend dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Prepare isolated CI database
        run: |
          mkdir -p "${{ github.workspace }}/.runtime/operatoros-ci"
          .venv/bin/python -m core.schema_migrations initialize-fresh --database "${{ github.workspace }}/.runtime/operatoros-ci/ci-test.db"
      - run: .venv/bin/python -c "from src.main import app; assert app is not None; routes = {route.path for route in app.routes}; assert '/api/system/clear-data' in routes; assert '/api/system/health' in routes"
      - run: .venv/bin/python -m pytest -q

  backend-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend-ts
    env:
      OPERATOROS_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Verify mise toolchain
        run: |
          mise --version
          bun --version | grep -Eq "^1\.4\."
          python --version
          mise ls --current
      - name: Create reference backend virtualenv
        run: python -m venv ../backend/.venv
      - name: Install reference backend dependencies
        run: ../backend/.venv/bin/python -m pip install -r ../backend/requirements.txt
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Verify Bun runtime and contract
        run: |
          mise --version
          bun --version | grep -Eq "^1\.4\."
          mise ls --current
      - name: Install dependencies (frozen lockfile)
        run: bun ci
      - name: Dependency deduplication check
        run: bun run check:dependencies
      - name: Architecture boundaries test
        run: bun run boundaries:test
      - name: OpenAPI contract drift check
        run: bun run api:check
      - name: TypeScript validation
        run: bun run typecheck
      - name: Frontend unit tests
        run: bun run test
      - name: Build frontend bundle
        run: bun run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Verify docs toolchain
        run: |
          mise --version
          python --version
      - name: Validate relative Markdown links
        run: python .github/scripts/check_markdown_links.py
