name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - master
      - develop
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 3"
    - cron: "17 3 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: preflight
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up locked toolchain and dependencies
        uses: ./.github/actions/setup-bun
        with:
          cache-write: "false"
      - name: Fetch base for skill freshness check
        env:
          INTENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          INTENT_FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$INTENT_BASE_SHA" =~ ^0+$ ]]; then
            INTENT_BASE_SHA="$INTENT_FALLBACK_SHA"
          fi
          if [[ -z "$INTENT_BASE_SHA" || "$INTENT_BASE_SHA" =~ ^0+$ ]]; then
            echo "A valid base or fallback commit is required for skill freshness checks." >&2
            exit 1
          fi
          git fetch --no-tags origin "$INTENT_BASE_SHA"
      - name: Validate relative Markdown links
        run: bun .github/scripts/check-markdown-links.ts
      - name: Validate Markdown organization and index
        run: bun .github/scripts/check-markdown-organization.ts
      - name: Validate agent skills
        run: bun run skills:validate
      - name: Check agent skill maintainer review
        run: bunx --no-install --package @tanstack/intent intent maintainer check --base FETCH_HEAD --github-summary
      - name: Require pull request changelog entry
        env:
          CHANGELOG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun .github/scripts/check-changelog.ts

  api:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    needs: [preflight]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch main for doctor validation
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Checkout removes persisted credentials; authenticate this single fetch for the private repository.
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" fetch --no-tags origin main:refs/remotes/origin/main
      - name: Set up locked toolchain and dependencies
        uses: ./.github/actions/setup-bun
      - name: Prepare disposable doctor database
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          OPERATOROS_DATA_DIR: ${{ runner.temp }}/operatoros/doctor-data
        run: |
          mkdir -p "$OPERATOROS_DATA_DIR"
          expected_schema="$(bun packages/db/src/schema-version-cli.ts --format current)"
          bun packages/db/src/dev-db-cli.ts ensure \
            --repo . \
            --data-dir "$OPERATOROS_DATA_DIR" \
            --expected-schema "$expected_schema"
      - name: Verify canonical toolchain and disposable runtime
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          OPERATOROS_DATA_DIR: ${{ runner.temp }}/operatoros/doctor-data
        run: mise run doctor
      - name: Restore Turbo task results
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-turbo-2.11.4-${{ hashFiles('bun.lock', 'turbo.json', 'mise.toml', 'mise.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-turbo-2.11.4-${{ hashFiles('bun.lock', 'turbo.json', 'mise.toml', 'mise.lock') }}-
      - name: Dependency security audit
        working-directory: ${{ github.workspace }}
        run: bun run security:audit
      - name: Test active Bun tooling
        working-directory: ${{ github.workspace }}
        run: bun test scripts/tests/dev-runtime.test.ts scripts/tests/worktree-safety.test.ts scripts/tests/test-scope.test.ts scripts/tests/e2e-workspace.test.ts scripts/tests/e2e-summaries.test.ts scripts/tests/readiness-seeder.test.ts scripts/tests/podman-source-manifest.test.ts
      - name: Release bundle rejection and workflow policy tests
        working-directory: ${{ github.workspace }}
        env:
          OPERATOROS_TEST_ROOTLESS_PODMAN: "1"
        run: |
          python3 -m unittest discover -s scripts/tests -p "test_release_bundle.py"
          python3 -m unittest discover -s scripts/tests -p "test_embedded_runtime.py"
          python3 -m unittest discover -s scripts/tests -p "test_operatoros_deploy.py"
      - name: Node SQLite release gate tests
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s scripts/tests -p "test_node_sqlite_runtime.py"
          python3 -m unittest discover -s scripts/tests -p "test_node_image_lifecycle.py"
      - name: Pinned Trivy OCI compatibility regression
        working-directory: ${{ github.workspace }}
        env:
          SCANNER_TEST_OUTPUT: ${{ runner.temp }}/operatoros-scanner-compat
        run: python3 scripts/tests/check_trivy_oci.py
      - name: Retain scanner compatibility failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scanner-compatibility-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/operatoros-scanner-compat/before.log
            ${{ runner.temp }}/operatoros-scanner-compat/reports/*.json
            ${{ runner.temp }}/operatoros-scanner-compat/reports/*.log
            ${{ runner.temp }}/operatoros-scanner-compat/reports/*.txt
            ${{ runner.temp }}/operatoros-scanner-compat/bad-reports/*.json
            ${{ runner.temp }}/operatoros-scanner-compat/bad-reports/*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Verify minimatch override compatibility
        working-directory: ${{ github.workspace }}
        run: |
          bun scripts/tests/minimatch-override.compatibility.cjs
          node scripts/tests/minimatch-override.compatibility.cjs
      - name: Verify hk checks
        working-directory: ${{ github.workspace }}
        env:
          HK_MISE: "1"
        run: hk check --all
      - name: Typecheck, test, and build workspaces
        working-directory: ${{ github.workspace }}
        run: |
          started_at=$(date +%s)
          bun run turbo:check
          elapsed=$(( $(date +%s) - started_at ))
          echo "turbo_check_elapsed_seconds=$elapsed" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the generated Start route tree is current
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts
      - name: Typecheck development launcher
        working-directory: ${{ github.workspace }}
        run: bun run typecheck:launcher
      - name: TypeScript 7 native typecheck
        working-directory: ${{ github.workspace }}
        run: bun run typecheck:native
      - name: Validate Turbo invalidation proofs
        working-directory: ${{ github.workspace }}
        run: bun run test:turbo
      - name: Prepare Elysia runtime database
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/operatoros-ci-elysia"
          bun run db:bootstrap --data-dir "$RUNNER_TEMP/operatoros-ci-elysia"
      - name: Verify Elysia primary runtime
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/operatoros-ci-elysia/operatoros.sqlite
          AUTH_COOKIE_SECRET: ci-elysia-test-secret-at-least-32-characters
          HOST: 127.0.0.1
          PORT: "8090"
          NODE_ENV: test
        run: |
          log_file="${RUNNER_TEMP}/operatoros-elysia.log"
          bun run src/server.ts >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8090/health >/dev/null && break
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8090/health >/dev/null
          curl --fail --silent http://127.0.0.1:8090/ready >/dev/null
      - name: TypeBox resolution check
        working-directory: ${{ github.workspace }}
        run: bun run check:typebox
      - name: Architecture checker fixture tests
        working-directory: ${{ github.workspace }}
        run: bun run test:architecture
      - name: Contract boundary check
        working-directory: ${{ github.workspace }}
        run: bun run check:contracts
      - name: Save Turbo task results
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-turbo-2.11.4-${{ hashFiles('bun.lock', 'turbo.json', 'mise.toml', 'mise.lock') }}-${{ github.sha }}
      - name: Report Turbo cache result
        if: always()
        env:
          TURBO_CACHE_HIT: ${{ steps.turbo-cache.outputs.cache-hit }}
        run: |
          echo "- Turbo task cache exact hit: \`${TURBO_CACHE_HIT:-false}\`" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked toolchain and dependencies
        uses: ./.github/actions/setup-bun
      - name: Dependency consistency check
        run: bun --filter @operatoros/web check:dependencies
      - name: Check package-manager regressions
        run: bun --filter @operatoros/web check:node-regressions
      - name: UI boundary check
        working-directory: ${{ github.workspace }}
        run: bun run check:ui
      - name: Architecture boundaries test
        run: bun --filter @operatoros/web boundaries:test
      - name: OpenAPI contract drift check
        run: bun --filter @operatoros/web api:check
      - name: Test documentation checker fixtures
        working-directory: ${{ github.workspace }}
        run: bun test scripts/tests/docs-checkers.test.ts
      - name: Validate current developer commands
        working-directory: ${{ github.workspace }}
        run: bun .github/scripts/check-current-developer-docs.ts
      - name: Verify agent skills package tarball and consumer
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/operatoros-agent-skills"
          mkdir -p "$package_dir"
          cd packages/agent-skills
          archive="$(bun pm pack --destination "$package_dir" --ignore-scripts --quiet)"
          test -f "$archive"
          entries="$(tar -tzf "$archive")"
          has_entry() {
            local expected="$1"
            local entry
            while IFS= read -r entry; do
              if [[ "$entry" == "$expected" ]]; then
                return 0
              fi
            done <<<"$entries"
            return 1
          }
          for package_path in README.md package.json; do
            if ! has_entry "package/$package_path"; then
              echo "Package tarball is missing $package_path" >&2
              exit 1
            fi
          done
          while IFS= read -r package_path; do
            if ! has_entry "package/$package_path"; then
              echo "Package tarball is missing $package_path" >&2
              exit 1
            fi
          done < <(git ls-files --cached --others --exclude-standard -- docs skills src)

          consumer_dir="$RUNNER_TEMP/operatoros-agent-skills-consumer"
          mkdir -p "$consumer_dir"
          cat > "$consumer_dir/package.json" <<EOF
          {
            "name": "operatoros-agent-skills-consumer-ci",
            "private": true,
            "devDependencies": { "@tanstack/intent": "0.5.6" },
            "dependencies": { "@operatoros/agent-skills": "file:$archive" },
            "intent": {
              "skills": ["@operatoros/agent-skills#elysiajs"],
              "exclude": ["@tanstack/intent"]
            }
          }
          EOF
          (cd "$consumer_dir" && bun install --ignore-scripts)
          (cd "$consumer_dir" && bunx --no-install --package @tanstack/intent intent list --json > intent-list.json)
          BUN_CONSUMER_DIR="$consumer_dir" bun -e '
            const result = await Bun.file(process.env.BUN_CONSUMER_DIR + "/intent-list.json").json()
            if (result.skills.length !== 1 || result.skills[0].use !== "@operatoros/agent-skills#elysiajs") {
              throw new Error("Consumer allowlist did not resolve exactly the Elysia skill")
            }
            if (result.hiddenSourceCount !== 0 || result.warnings.length || result.conflicts.length) {
              throw new Error("Consumer skill discovery reported hidden sources, warnings, or conflicts")
            }
          '
          skill_path="$(cd "$consumer_dir" && bunx --no-install --package @tanstack/intent intent load @operatoros/agent-skills#elysiajs --path)"
          test -f "$consumer_dir/$skill_path"

  release:
    if: github.event.schedule == '17 4 * * 3' || github.event_name == 'workflow_dispatch'
    name: Full release validation
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up locked toolchain and dependencies
        uses: ./.github/actions/setup-bun
      - name: Fetch main for doctor validation
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Prepare disposable development database
        env:
          OPERATOROS_DATA_DIR: ${{ runner.temp }}/operatoros/data
        run: |
          mkdir -p "$OPERATOROS_DATA_DIR"
          expected_schema="$(bun packages/db/src/schema-version-cli.ts --format current)"
          bun packages/db/src/dev-db-cli.ts ensure \
            --repo . \
            --data-dir "$OPERATOROS_DATA_DIR" \
            --expected-schema "$expected_schema"
      - name: Verify canonical toolchain and disposable runtime
        env:
          OPERATOROS_DATA_DIR: ${{ runner.temp }}/operatoros/data
        run: mise run doctor
      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-26.04-${{ runner.arch }}-playwright-${{ hashFiles('apps/web/package.json', 'bun.lock') }}
      - name: Install Playwright Chromium and Ubuntu dependencies
        working-directory: apps/web
        run: bun run --bun playwright install --with-deps chromium
      - name: Save Playwright Chromium
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-26.04-${{ runner.arch }}-playwright-${{ hashFiles('apps/web/package.json', 'bun.lock') }}
      - name: Dependency security audit
        run: bun run security:audit
      - name: Run full release validation
        run: mise run check:full
      - name: Report full validation summary
        if: always()
        run: |
          if [[ -f e2e-results/summary.txt ]]; then
            cat e2e-results/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Playwright browser cache exact hit: \`${PLAYWRIGHT_CACHE_HIT:-false}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      - name: Upload full validation failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operatoros-full-validation-failure-evidence
          path: |
            e2e-results/summary.txt
            e2e-results/database-before.json
            e2e-results/database-after.json
            e2e-results/logs/
            e2e-results/junit/
            e2e-results/playwright/
          if-no-files-found: warn
          retention-days: 7


  candidate-qualification:
    name: Nonpublishing release candidate qualification
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    needs: [preflight]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out selected candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked toolchain and dependencies
        uses: ./.github/actions/setup-bun
      - name: Install container build tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Build candidate OCI image and produce scan evidence
        env:
          CANDIDATE_IMAGE: operatoros-api:candidate-${{ github.sha }}
          CANDIDATE_ROOT: ${{ runner.temp }}/operatoros-candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun scripts/podman-source-manifest.mjs assert-clean .
          mkdir -p "$CANDIDATE_ROOT"
          bun scripts/podman-source-manifest.mjs write-manifest . "$CANDIDATE_ROOT/source-manifest.json"
          source_tree_sha="$(sha256sum "$CANDIDATE_ROOT/source-manifest.json" | cut -d' ' -f1)"
          podman build \
            --ignorefile deploy/podman/.containerignore \
            --platform linux/amd64 \
            -f deploy/podman/Containerfile.api \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "SOURCE_TREE_SHA256=$source_tree_sha" \
            --build-arg SOURCE_DIRTY=false \
            -t "$CANDIDATE_IMAGE" .
          podman save --format oci-archive -o "$CANDIDATE_ROOT/image.oci.tar" "$CANDIDATE_IMAGE"
          python3 - "$CANDIDATE_ROOT" "$GITHUB_SHA" <<'PY'
          import importlib.util
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location("release", "scripts/release-bundle.py")
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          image = release.scan_image(
              root / "image.oci.tar",
              sys.argv[2],
              root / "oci-layout",
              root / "reports",
              "podman",
          )
          (root / "image.json").write_text(json.dumps(image, indent=2) + "\n")
          PY
          python3 - "$CANDIDATE_ROOT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          archive = json.loads((root / "reports/archive.json").read_text())
          image = json.loads((root / "image.json").read_text())
          scan = json.loads((root / "reports/scan.json").read_text())
          counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0, "UNKNOWN": 0}
          for result in scan.get("Results", []):
              for finding in result.get("Vulnerabilities", []) or []:
                  severity = str(finding.get("Severity", "UNKNOWN")).upper()
                  counts[severity if severity in counts else "UNKNOWN"] += 1
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("## Ephemeral candidate build and scan\n\n")
              summary.write(f"- Source commit: `{archive['source_commit']}`\n")
              summary.write(f"- OCI manifest digest: `{image['manifest_digest']}`\n")
              summary.write(f"- Image config digest: `{image['image_id']}`\n")
              summary.write(f"- OCI archive SHA-256: `{archive['archive_sha256']}`\n")
              summary.write(f"- SBOM and Trivy scan: generated and identity-checked for the same image\n")
              summary.write(f"- Trivy findings by severity: `{json.dumps(counts, sort_keys=True)}`\n")
              summary.write("- The candidate OCI image stays on the ephemeral runner and is not uploaded.\n\n")
          PY
      - name: Require both Node SQLite runtimes to pass
        env:
          CANDIDATE_IMAGE: operatoros-api:candidate-${{ github.sha }}
          CANDIDATE_ROOT: ${{ runner.temp }}/operatoros-candidate
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE_ROOT"
          set +e
          python3 scripts/check-node-sqlite-runtime.py "$CANDIDATE_IMAGE" > "$CANDIDATE_ROOT/runtime-gate.json" 2>&1
          gate_status=$?
          set -e
          python3 scripts/record-embedded-runtime.py \
            --runtime "$CANDIDATE_ROOT/runtime-gate.json" \
            --image "$CANDIDATE_ROOT/image.json" \
            --archive "$CANDIDATE_ROOT/reports/archive.json" \
            --containerfile deploy/podman/Containerfile.api \
            --sbom "$CANDIDATE_ROOT/reports/sbom.cdx.json" \
            --output "$CANDIDATE_ROOT/reports/embedded-runtime.json"
          python3 - "$CANDIDATE_ROOT" "$GITHUB_SHA" "$gate_status" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          source = sys.argv[2]
          status = int(sys.argv[3])
          with (root / "runtime-gate.json").open(encoding="utf-8") as handle:
              report = json.load(handle)
          image = json.loads((root / "image.json").read_text())
          libraries = report.get("sqliteRuntimes")
          providers = {item.get("provider") for item in libraries if isinstance(item, dict)} if isinstance(libraries, list) else set()
          if status != 0 or report.get("status") != "PASS" or providers != {"better-sqlite3", "node:sqlite"} or len(libraries) != 2:
              raise SystemExit("candidate Node SQLite runtimes did not pass qualification")
          for library in libraries:
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", str(library.get("version", "")))
              version = tuple(map(int, match.groups())) if match else ()
              if not version or (library.get("fts5") is True and version < (3, 54, 0)):
                  raise SystemExit(f"candidate SQLite runtime is below the fixed version in {library.get('provider', 'unknown')}")
          outcome = "RUNTIME_GATE_PASS"
          with open(sys.argv[4], "a", encoding="utf-8") as summary:
              summary.write("## Node.js and SQLite driver qualification\n\n")
              summary.write(f"- Source commit: `{source}`\n")
              summary.write(f"- OCI manifest digest: `{image['manifest_digest']}`\n")
              summary.write(f"- Qualification outcome: `{outcome}`\n")
              summary.write(f"- Node.js: `{report.get('node', 'unavailable')}`\n")
              summary.write(f"- Node.js binary SHA-256: `{report.get('nodeBinarySha256', 'unavailable')}`\n")
              summary.write(f"- better-sqlite3: `{report.get('betterSqlite3', 'unavailable')}`\n")
              for library in libraries:
                  summary.write(f"- `{library['provider']}` SQLite: `{library['version']}`; source ID `{library['sourceId']}`; FTS5 `{library['fts5']}`\n")
              summary.write("- Node.js built-in and better-sqlite3 SQLite components are included in CycloneDX and `embedded-runtime.json`; OS/language scan remains in separate Trivy evidence.\n")
              summary.write("- Runtime gate passed. Candidate remains unsigned, unattested, and unpublished.\n")
              summary.write("\n")
          PY
      - name: Exercise exact candidate lifecycle and encrypted restore
        env:
          CANDIDATE_IMAGE: operatoros-api:candidate-${{ github.sha }}
          CANDIDATE_ROOT: ${{ runner.temp }}/operatoros-candidate
        run: |
          set -euo pipefail
          python3 scripts/verify-node-image-lifecycle.py \
            --image "$CANDIDATE_IMAGE" \
            --image-metadata "$CANDIDATE_ROOT/image.json" \
            --archive-metadata "$CANDIDATE_ROOT/reports/archive.json" \
            --source "$GITHUB_SHA" \
            --output "$CANDIDATE_ROOT/lifecycle.json"
          python3 - "$CANDIDATE_ROOT/lifecycle.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("status") != "PASS":
              raise SystemExit("exact candidate lifecycle report did not pass")
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("## Exact candidate API lifecycle\n\n")
              summary.write(f"- Source commit: `{report['source_commit']}`\n")
              summary.write(f"- OCI manifest digest: `{report['oci_manifest_digest']}`\n")
              summary.write(f"- Image config digest: `{report['image_config_digest']}`\n")
              summary.write(f"- OCI archive SHA-256: `{report['oci_archive_sha256']}`\n")
              for name, evidence in report["stages"].items():
                  summary.write(f"- `{name}`: `{evidence['status']}`\n")
              summary.write(f"- Encrypted backup SHA-256: `{report['stages']['restore_encrypted_backup']['backup_sha256']}`\n")
              summary.write(f"- Restored backup metadata SHA-256: `{report['stages']['restore_encrypted_backup']['metadata_sha256']}`\n")
              summary.write(f"- Duration: `{report['duration_seconds']}` seconds\n\n")
          PY
      - name: Retain non-image candidate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operatoros-candidate-reports-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/operatoros-candidate/image.json
            ${{ runner.temp }}/operatoros-candidate/runtime-gate.json
            ${{ runner.temp }}/operatoros-candidate/reports/archive.json
            ${{ runner.temp }}/operatoros-candidate/reports/embedded-runtime.json
            ${{ runner.temp }}/operatoros-candidate/reports/sbom.cdx.json
            ${{ runner.temp }}/operatoros-candidate/reports/scan.json
            ${{ runner.temp }}/operatoros-candidate/lifecycle.json
          if-no-files-found: warn
          retention-days: 7


  release-bundle:
    name: Manual release bundle
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [release, result]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: operatoros-release-bundle
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the validated source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up locked toolchain and dependencies
        uses: ./.github/actions/setup-bun
      - name: Install container build tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Build and inspect release artifacts
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/operatoros-release.tar
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release-bundle.py build "$RELEASE_OUTPUT"
      - name: Verify embedded runtime and mandatory evidence before signing
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/operatoros-release.tar
        run: |
          python3 scripts/release-bundle.py verify-evidence "$RELEASE_OUTPUT" "$GITHUB_SHA"
      - name: Attest the complete release bundle
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/operatoros-release.tar
      - name: Verify provenance and start an isolated consumer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTPUT: ${{ runner.temp }}/operatoros-release.tar
        run: bash scripts/test-release-consumer.sh "$RELEASE_OUTPUT" "$GITHUB_SHA"
      - name: Retain immutable release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operatoros-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/operatoros-release.tar
            ${{ runner.temp }}/operatoros-release.tar.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Retain build and scan failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operatoros-release-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-diagnostics/*.json
            ${{ runner.temp }}/release-diagnostics/*.log
            ${{ runner.temp }}/release-diagnostics/*.txt
          if-no-files-found: warn
          retention-days: 7


  changes:
    if: github.event_name != 'schedule'
    name: Select E2E scope
    needs: [preflight]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run-e2e: ${{ steps.scope.outputs.run-e2e }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select E2E execution
        id: scope
        run: bash .github/scripts/select-e2e-scope.sh

  e2e-full:
    name: E2E full regression
    if: github.event_name != 'schedule'
    needs: [preflight]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked toolchain and dependencies
        uses: ./.github/actions/setup-bun
      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-26.04-${{ runner.arch }}-playwright-${{ hashFiles('apps/web/package.json', 'bun.lock') }}
      - name: Install Playwright Chromium and Ubuntu dependencies
        working-directory: apps/web
        run: bun run --bun playwright install --with-deps chromium
      - name: Save Playwright Chromium
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-26.04-${{ runner.arch }}-playwright-${{ hashFiles('apps/web/package.json', 'bun.lock') }}
      - name: Run complete browser and API smoke suite with disposable reset verification
        env:
          CI: "true"
          DATABASE_URL: "sqlite:///:memory:"
          ENABLE_DESTRUCTIVE_OPERATIONS: "false"
          OPERATOROS_E2E_ADMIN_USERNAME: operatoros_e2e_admin
          OPERATOROS_E2E_ADMIN_PASSWORD: "E2E-Admin-2026-Secure!"
          OPERATOROS_E2E_PRESERVE_SUCCESS_ARTIFACTS: "true"
        run: timeout 900 make e2e-smoke
      - name: Report E2E summaries
        if: always()
        run: |
          for summary in e2e-results/summary.txt; do
            if [[ -f "$summary" ]]; then
              cat "$summary"
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [[ -n "${PLAYWRIGHT_CACHE_HIT:-}" ]]; then
            echo "- Playwright browser cache exact hit: \`${PLAYWRIGHT_CACHE_HIT}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      - name: Upload concise E2E summaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operatoros-e2e-summaries
          path: |
            e2e-results/summary.txt
            e2e-results/database-before.json
            e2e-results/database-after.json
            e2e-results/junit/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: operatoros-e2e-failure-evidence
          path: |
            e2e-results/logs/
            e2e-results/junit/
            e2e-results/playwright/
          if-no-files-found: warn
          retention-days: 7

  result:
    name: E2E regression result
    if: always() && github.event_name != 'schedule'
    needs: [changes, e2e-full]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the selected E2E result
        env:
          E2E_SCOPE_RESULT: ${{ needs.changes.result }}
          E2E_SELECTED: ${{ needs.changes.outputs.run-e2e }}
          E2E_JOB_RESULT: ${{ needs.e2e-full.result }}
        run: bash .github/scripts/validate-e2e-result.sh

  audit:
    if: github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked toolchain and dependencies
        uses: ./.github/actions/setup-bun
        with:
          cache-write: "false"
      - name: Run dependency security audit
        run: bun run security:audit
