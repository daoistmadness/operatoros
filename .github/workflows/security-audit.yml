name: Scheduled dependency security audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

cache-mode: read

defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked toolchain and dependencies
        uses: ./.github/actions/setup-bun
        with:
          cache-write: "false"
      - name: Run dependency security audit
        run: bun run security:audit
